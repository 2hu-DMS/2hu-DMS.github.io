<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps - Mapa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 12pt;
            background-color: #d7deff;
            padding-bottom: 76px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-size: 23pt;
        }

        .nav-icon-button {
            font-size: 15pt;
        }

        .navbar.fixed-bottom {
            background-color: #ffffff !important;
        }

        .navbar.fixed-bottom .nav-icon-button {
            margin: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-3">
            <a href="index.html" class="nav-icon-button" data-page="index" aria-label="Inicio">
                <img src="icons/casa.png" alt="" aria-hidden="true">
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <img src="icons/mapita.png" alt="" aria-hidden="true">
            </a>
            <a href="search.html" class="nav-icon-button" data-page="search" aria-label="Buscar">
                <img src="icons/lupa.png" alt="" aria-hidden="true">
            </a>
        </div>
    </nav>

    <main class="container text-center py-4">
        <div class="card border-0 shadow-sm mt-4" style="height: 400px; background: rgba(255,255,255,0.45); border-radius: 20px;"></div>
    </main>

    <script>
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'index' && currentPage === 'index.html') ||
                (page === 'map' && currentPage === 'map.html') ||
                (page === 'search' && currentPage === 'search.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>
</body>
</html>
