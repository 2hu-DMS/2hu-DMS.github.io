<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps - Búsqueda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 12pt;
            background-color: #d7deff;
            padding-bottom: 76px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-size: 23pt;
        }

        .nav-icon-button {
            font-size: 15pt;
        }

        .navbar.fixed-bottom {
            background-color: #ffffff !important;
        }

        .navbar.fixed-bottom .nav-icon-button {
            margin: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-3">
            <a href="index.html" class="nav-icon-button" data-page="index" aria-label="Inicio">
                <i class="bi bi-house-door-fill"></i>
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <i class="bi bi-map-fill"></i>
            </a>
            <a href="search.html" class="nav-icon-button" data-page="search" aria-label="Buscar">
                <i class="bi bi-search"></i>
            </a>
        </div>
    </nav>

    <main class="container text-center py-4">
        <h1 class="fw-bold" style="color: #004aac;">Edificios</h1>

        <div class="d-grid gap-3 mt-4">
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Edificio histórico
            </button>
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Daract 1
            </button>
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Daract 2
            </button>
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Edificio de laboratorios
            </button>
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Dorrego 1
            </button>
            <button type="button" class="nav-icon-button" style="width: 100%; max-width: 100%; border-radius: 16px; height: 52px; padding: 0 20px; justify-content: center;">
                Edificio de mantenimiento
            </button>
        </div>
    </main>

    <script>
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'index' && currentPage === 'index.html') ||
                (page === 'map' && currentPage === 'map.html') ||
                (page === 'search' && currentPage === 'search.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>
</body>
</html>
