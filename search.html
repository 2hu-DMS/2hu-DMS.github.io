<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps - Búsqueda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 12pt;
            background-color: #d7deff;
            padding-bottom: 76px;
            transition: background-color 0.5s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            font-size: 23pt;
        }

        .nav-icon-button {
            font-size: 15pt;
        }

        .navbar.fixed-bottom {
            background-color: #ffffff !important;
        }

        .navbar.fixed-bottom .nav-icon-button {
            margin: 0;
        }

        body.has-open-building {
            background-color: #004aac;
        }

        body.has-open-building h1 {
            color: #ffffff !important;
        }

        main h1 {
            transition: color 0.5s ease;
        }

        .building-list {
            max-width: 560px;
            margin-right: auto;
            margin-left: auto;
        }

        .building-item {
            overflow: hidden;
            border-radius: 16px;
        }

        .building-button {
            width: 100%;
            min-height: 52px;
            padding: 0 20px;
            border: 0;
            border-radius: 16px;
            background-color: #ffffff;
            color: #004aac;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font: inherit;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .building-button:hover,
        .building-button:focus-visible {
            background-color: #ffffff;
            color: #004aac;
            outline: 2px solid #d7deff;
            outline-offset: 2px;
        }

        .building-button[aria-expanded="true"] {
            border-radius: 16px 16px 0 0;
            background-color: #5070fe;
            color: #ffffff;
        }

        .building-button i {
            position: absolute;
            right: 20px;
            transition: transform 0.2s ease;
        }

        .building-button[aria-expanded="true"] i {
            transform: rotate(180deg);
        }

        .building-options {
            padding: 16px 20px;
            border-radius: 0 0 16px 16px;
            background-color: #5070fe;
            color: #ffffff;
            text-align: left;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .building-options[hidden] {
            display: none;
        }

        .room-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .room-button {
            min-height: 44px;
            border: 0;
            border-radius: 12px;
            background-color: #ffffff;
            color: #004aac;
            font: inherit;
            font-size: 15pt;
            transition: all 0.2s ease-in-out;
        }

        .building-button {
            font-size: 15pt;
        }

        .room-button:hover,
        .room-button:focus-visible {
            background-color: #5070fe;
            color: #ffffff;
        }

        .room-button:active,
        .room-button.is-selected {
            background-color: #004aac;
            color: #ffffff;
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            main h1,
            .building-button,
            .building-options {
                transition-duration: 0.01ms;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-3">
            <a href="index.html" class="nav-icon-button" data-page="index" aria-label="Inicio">
                <img src="icons/casa.png" alt="" aria-hidden="true">
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <img src="icons/mapita.png" alt="" aria-hidden="true">
            </a>
            <a href="search.html" class="nav-icon-button" data-page="search" aria-label="Buscar">
                <img src="icons/lupa.png" alt="" aria-hidden="true">
            </a>
        </div>
    </nav>

    <main class="container text-center py-4">
        <h1 class="fw-bold" style="color: #004aac;">Edificios</h1>

        <div class="d-grid gap-3 mt-4 building-list">
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-historico">
                    Edificio histórico <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-historico" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-daract-1">
                    Daract 1 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-daract-1" hidden>
                    <div class="room-grid">
                        <button type="button" class="room-button">Aula 1</button>
                        <button type="button" class="room-button">Aula 2</button>
                        <button type="button" class="room-button">Aula 3</button>
                        <button type="button" class="room-button">Aula 4</button>
                        <button type="button" class="room-button">Aula 5</button>
                        <button type="button" class="room-button">Aula 6</button>
                        <button type="button" class="room-button">Biblioteca</button>
                        <button type="button" class="room-button">Baños</button>
                    </div>
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-daract-2">
                    Daract 2 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-daract-2" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-laboratorios">
                    Edificio de laboratorios <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-laboratorios" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-dorrego-1">
                    Dorrego 1 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-dorrego-1" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-mantenimiento">
                    Edificio de mantenimiento <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-mantenimiento" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
        </div>
    </main>

    <script>
        const buildingButtons = document.querySelectorAll('.building-button');

        buildingButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const options = document.getElementById(button.getAttribute('aria-controls'));
                const shouldOpen = button.getAttribute('aria-expanded') !== 'true';

                buildingButtons.forEach((item) => {
                    item.setAttribute('aria-expanded', 'false');
                    document.getElementById(item.getAttribute('aria-controls')).hidden = true;
                });

                if (shouldOpen) {
                    button.setAttribute('aria-expanded', 'true');
                    options.hidden = false;
                }

                document.body.classList.toggle('has-open-building', shouldOpen);
            });
        });

        document.querySelectorAll('.room-grid').forEach((grid) => {
            grid.addEventListener('click', (event) => {
                const selectedButton = event.target.closest('.room-button');
                if (!selectedButton) return;

                grid.querySelectorAll('.room-button').forEach((button) => {
                    button.classList.toggle('is-selected', button === selectedButton);
                });
            });
        });

        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'index' && currentPage === 'index.html') ||
                (page === 'map' && currentPage === 'map.html') ||
                (page === 'search' && currentPage === 'search.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>
</body>
</html>
