<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps - Búsqueda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-search">
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-3">
            <a href="index.html" class="nav-icon-button" data-page="index" aria-label="Inicio">
                <img src="img/icons/casa.png" alt="" aria-hidden="true">
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <img src="img/icons/mapita.png" alt="" aria-hidden="true">
            </a>
            <a href="aulas.html" class="nav-icon-button" data-page="search" aria-label="Buscar">
                <img src="img/icons/lupa.png" alt="" aria-hidden="true">
            </a>
        </div>
    </nav>

    <main class="container text-center py-4">
        <h1 class="fw-bold page-heading">Aulas</h1>

        <div class="d-grid gap-3 mt-4 building-list">
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-historico">
                    Edificio histórico <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-historico" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-daract-1">
                    Daract 1 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-daract-1" hidden>
                    <div class="room-grid">
                        <button type="button" class="room-button">Aula 1</button>
                        <button type="button" class="room-button">Aula 2</button>
                        <button type="button" class="room-button">Aula 3</button>
                        <button type="button" class="room-button">Aula 4</button>
                        <button type="button" class="room-button">Aula 5</button>
                        <button type="button" class="room-button">Aula 6</button>
                        <button type="button" class="room-button">Biblioteca</button>
                        <button type="button" class="room-button">Baños</button>
                    </div>
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-daract-2">
                    Daract 2 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-daract-2" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-laboratorios">
                    Edificio de laboratorios <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-laboratorios" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-dorrego-1">
                    Dorrego 1 <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-dorrego-1" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
            <div class="building-item">
                <button type="button" class="building-button" aria-expanded="false" aria-controls="options-mantenimiento">
                    Edificio de mantenimiento <i class="bi bi-chevron-down" aria-hidden="true"></i>
                </button>
                <div class="building-options" id="options-mantenimiento" hidden>
                    Las opciones de aulas se agregarán aquí.
                </div>
            </div>
        </div>
    </main>

    <script>
        const buildingButtons = document.querySelectorAll('.building-button');

        buildingButtons.forEach((button) => {
            button.addEventListener('click', () => {
                const options = document.getElementById(button.getAttribute('aria-controls'));
                const shouldOpen = button.getAttribute('aria-expanded') !== 'true';

                buildingButtons.forEach((item) => {
                    item.setAttribute('aria-expanded', 'false');
                    const itemOptions = document.getElementById(item.getAttribute('aria-controls'));
                    const itemElement = item.closest('.building-item');
                    itemElement.classList.remove('is-open');
                    itemOptions.hidden = true;
                });

                if (shouldOpen) {
                    const buildingItem = button.closest('.building-item');
                    options.hidden = false;
                    options.getBoundingClientRect();
                    button.setAttribute('aria-expanded', 'true');
                    buildingItem.classList.add('is-open');
                }

                document.body.classList.toggle('has-open-building', shouldOpen);
            });
        });

        document.querySelectorAll('.room-grid').forEach((grid) => {
            grid.addEventListener('click', (event) => {
                const selectedButton = event.target.closest('.room-button');
                if (!selectedButton) return;

                grid.querySelectorAll('.room-button').forEach((button) => {
                    button.classList.toggle('is-selected', button === selectedButton);
                });
            });
        });

        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'index' && currentPage === 'index.html') ||
                (page === 'map' && currentPage === 'map.html') ||
                (page === 'search' && currentPage === 'aulas.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>
</body>
</html>
