<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNMaps</title>
    <!-- Bootstrap CSS CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            font-size: 12pt;
            background-color: #d7deff;
            padding-bottom: 76px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-size: 23pt;
        }

        .nav-icon-button {
            font-size: 15pt;
        }

        .navbar.fixed-bottom {
            background-color: #ffffff !important;
        }

        .navbar.fixed-bottom .nav-icon-button {
            margin: 0;
        }

        #destinosCarousel {
            touch-action: pan-y;
            user-select: none;
            cursor: grab;
        }

        #destinosCarousel.dragging {
            cursor: grabbing;
        }
    </style>
</head>
<body>

    <!-- 1. Barra de navegación (Navbar) -->
    <nav class="navbar fixed-bottom py-2">
        <div class="container-fluid justify-content-center gap-3">
            <a href="index.html" class="nav-icon-button" data-page="index" aria-label="Inicio">
                <i class="bi bi-house-door-fill"></i>
            </a>
            <a href="map.html" class="nav-icon-button" data-page="map" aria-label="Mapa">
                <i class="bi bi-map-fill"></i>
            </a>
            <a href="search.html" class="nav-icon-button" data-page="search" aria-label="Buscar">
                <i class="bi bi-search"></i>
            </a>
        </div>
    </nav>

    <main class="container text-center py-4">
        <h1 class="fw-bold" style="color: #004aac;">¡Bienvenido/a! ¿A dónde vamos?</h1>

        <div class="d-flex justify-content-center gap-3 mt-4">
            <button type="button" class="nav-icon-button" aria-label="Edificios" style="width: 140px; border-radius: 999px;">
                Edificios
            </button>
            <button type="button" class="nav-icon-button" aria-label="Aulas" style="width: 140px; border-radius: 999px;">
                Aulas
            </button>
        </div>

        <div class="d-flex justify-content-center mt-3">
            <button type="button" class="nav-icon-button" aria-label="Emergencia" style="width: 303px; border-radius: 999px;">
                Emergencia
            </button>
        </div>

        <h2 class="fw-bold mt-5" style="color: #004aac;">Destinos destacados</h2>

        <div id="destinosCarousel" class="carousel slide mt-4" data-bs-ride="false" data-bs-touch="true" data-bs-interval="false">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <div class="row g-3 justify-content-center">
                        <div class="col-6">
                            <div class="card border-0 shadow-sm" style="height: 180px; background: rgba(255,255,255,0.45);"></div>
                        </div>
                        <div class="col-6">
                            <div class="card border-0 shadow-sm" style="height: 180px; background: rgba(255,255,255,0.45);"></div>
                        </div>
                    </div>
                </div>
                <div class="carousel-item">
                    <div class="row g-3 justify-content-center">
                        <div class="col-6">
                            <div class="card border-0 shadow-sm" style="height: 180px; background: rgba(255,255,255,0.45);"></div>
                        </div>
                        <div class="col-6">
                            <div class="card border-0 shadow-sm" style="height: 180px; background: rgba(255,255,255,0.45);"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        const navButtons = document.querySelectorAll('.navbar .nav-icon-button');

        navButtons.forEach((button) => {
            const page = button.dataset.page;
            const isCurrentPage =
                (page === 'index' && currentPage === 'index.html') ||
                (page === 'map' && currentPage === 'map.html') ||
                (page === 'search' && currentPage === 'search.html');

            button.classList.toggle('active', isCurrentPage);

            button.addEventListener('click', () => {
                navButtons.forEach((item) => item.classList.remove('active'));
                button.classList.add('active');
            });
        });

        const carousel = document.getElementById('destinosCarousel');
        let startX = 0;
        let dragging = false;

        carousel.addEventListener('pointerdown', (event) => {
            dragging = true;
            startX = event.clientX;
            carousel.classList.add('dragging');
        });

        carousel.addEventListener('pointerup', (event) => {
            if (!dragging) return;
            dragging = false;
            carousel.classList.remove('dragging');

            const deltaX = event.clientX - startX;
            if (Math.abs(deltaX) > 50) {
                const bsCarousel = bootstrap.Carousel.getOrCreateInstance(carousel);
                if (deltaX < 0) {
                    bsCarousel.next();
                } else {
                    bsCarousel.prev();
                }
            }
        });

        carousel.addEventListener('pointerleave', () => {
            dragging = false;
            carousel.classList.remove('dragging');
        });
    </script>

    <!-- Bootstrap JS Bundle con Popper (necesario para menús desplegables, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
